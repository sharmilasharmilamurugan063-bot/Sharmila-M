{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><form class="card form" id="loginForm"><h1>Welcome back</h1><p>Login to save and review your plans.</p><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn primary" type="submit">Login</button><p id="formMsg" class="msg"></p><p>New here? <a href="/register">Create an account</a></p></form></div>{% endblock %}{% block scripts %}<script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f)),headers:{'Content-Type':'application/json'}});if(r.ok){location.href='/dashboard'}else{document.getElementById('formMsg').textContent=r.data.detail||'Login failed'}});</script>{% endblock %}
