{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><form class="card form" id="registerForm"><h1>Create account</h1><p>Save your personalized recommendations.</p><label>Name<input name="name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label><button class="btn primary" type="submit">Register</button><p id="formMsg" class="msg"></p><p>Already registered? <a href="/login">Login</a></p></form></div>{% endblock %}{% block scripts %}<script>document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await api('/api/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(f)),headers:{'Content-Type':'application/json'}});if(r.ok){location.href='/login'}else{document.getElementById('formMsg').textContent=r.data.detail||'Registration failed'}});</script>{% endblock %}
