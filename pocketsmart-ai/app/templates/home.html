{% extends "base.html" %}{% block title %}Home Interior Planner{% endblock %}{% block content %}<section class="page"><p class="eyebrow">HOME INTERIOR</p><h1>Build a beautiful home budget.</h1><p class="lead">Tell us your rooms, style and quantities. PocketSmart will prioritize the essentials first.</p><form id="homeForm" class="planner-form"><label>Budget (INR)<input id="homeBudget" type="number" min="1" required value="50000"></label><label>Rooms<input id="homeRooms" required value="Living Room, Bedroom"></label><label>Style<select id="homeStyle"><option>modern</option><option>minimalist</option><option>traditional</option></select></label><label>Items <small>Use category:quantity, e.g. lighting:2</small><input id="homeItems" required value="lighting:2, furniture:1, decor:2"></label><label>Notes<textarea id="homeNotes" placeholder="Any preferences?"></textarea></label><button class="btn primary" type="submit">Generate home plan</button></form><div id="result" class="result"></div></section>{% endblock %}
