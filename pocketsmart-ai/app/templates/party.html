{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block content %}<section class="page"><p class="eyebrow">PARTY PLANNER</p><h1>Plan the event without budget guesswork.</h1><p class="lead">Allocate your money across catering, decoration and optional guest stay.</p><form id="partyForm" class="planner-form"><label>Total budget (INR)<input id="partyBudget" type="number" min="1" required value="50000"></label><label>Guests<input id="guests" type="number" min="1" required value="30"></label><label>Event type<select id="eventType"><option>birthday</option><option>corporate</option><option>wedding</option></select></label><label>Venue<input id="venue" value="indoor"></label><label>City<input id="city" placeholder="Optional"></label><label>Notes<textarea id="partyNotes"></textarea></label><button class="btn primary" type="submit">Generate party plan</button></form><div id="result" class="result"></div></section>{% endblock %}
