{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<section class="page"><p class="eyebrow">JEWELRY MATCH</p><h1>Find jewelry that fits the occasion and budget.</h1><p class="lead">Optionally upload an outfit image for broad color/formality matching.</p><form id="jewelryForm" class="planner-form" enctype="multipart/form-data"><label>Budget (INR)<input name="budget" type="number" min="1" required value="5000"></label><label>Occasion<input name="occasion" required value="wedding"></label><label>Style<select name="style"><option>traditional</option><option>modern</option><option>minimal</option><option>elegant</option></select></label><label>Outfit notes<textarea name="outfit_notes" placeholder="Color, neckline, dress style..."></textarea></label><label>Outfit image (optional)<input name="outfit_image" type="file" accept="image/*"></label><button class="btn primary" type="submit">Generate jewelry plan</button></form><div id="result" class="result"></div></section>{% endblock %}
